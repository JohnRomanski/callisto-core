name: release

# Publishes to PyPI with trusted publishing (no API token stored in GitHub).
# One-time setup on PyPI: add this repository and the `release.yml` workflow
# with environment `pypi` as a trusted publisher for the project.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the package version
        run: |
          version=$(python3 -c 'exec(open("callisto_core/utils/version.py").read()); print(__version__)')
          test "${GITHUB_REF_NAME#v}" = "$version" || {
            echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
