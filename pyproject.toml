[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "callisto-core"
dynamic = ["version"]
description = "Report intake, escrow, matching and secure delivery code for Callisto, an online reporting system for sexual assault."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Project Callisto", email = "tech@projectcallisto.org" }]
requires-python = ">=3.12"
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "argon2-cffi>=23.1",
    "celery>=5.4,<6",
    "django>=5.2,<6.0",
    "django-celery-results>=2.5",
    "django-decorator-include>=3.0",
    "django-nested-admin>=4.1",
    "django-polymorphic>=4.0",
    "django-ratelimit>=4.1",
    "django-widget-tweaks>=1.5",
    "pynacl>=1.5",
    "python-gnupg>=0.5.4",
    "reportlab>=4.2",
    "requests>=2.32",
]

[project.urls]
Homepage = "https://www.projectcallisto.org"
Source = "https://github.com/project-callisto/callisto-core"

[dependency-groups]
test = [
    "coverage>=7.6",
    "django-migration-testcase>=0.0.15",
    "psycopg[binary]>=3.2",
    "pypdf>=5.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-django>=4.9",
    "ruff>=0.14",
    "selenium>=4.25",
]
# extra packages used by the demo app in callisto_core.utils.settings_live
demo = [
    "dj-database-url>=2.3",
    "django-extensions>=3.2",
    "gunicorn>=23.0",
    "redis>=5.2",
    "whitenoise>=6.8",
]
dev = [
    { include-group = "test" },
    { include-group = "demo" },
    "pre-commit>=4.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.version]
path = "callisto_core/utils/version.py"

[tool.hatch.build.targets.sdist]
include = ["callisto_core", "docs", "LICENSE", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["callisto_core"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "callisto_core.utils.settings"
python_files = ["test.py", "tests.py", "test_*.py", "tests_*.py", "*_test.py", "*_tests.py"]

[tool.ruff]
target-version = "py312"
line-length = 88
# generated by makemigrations; leave as written
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
# printf/format() -> f-string rewrites are style churn without a fixer
ignore = ["UP030", "UP031"]

[tool.ruff.lint.per-file-ignores]
# settings modules re-export the base settings with star imports
"callisto_core/utils/settings*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "django", "first-party", "local-folder"]
known-first-party = ["callisto_core"]
combine-as-imports = true

[tool.ruff.lint.isort.sections]
django = ["django"]
